  <!-- Inner neural node -->
  <circle cx="100" cy="95" r="14" fill="url(#logoGrad)" opacity="0.9"/>
  <!-- Neural connections -->
  <line x1="100" y1="81" x2="100" y2="50" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="109" x2="100" y2="140" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="88" y1="88" x2="60" y2="75" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="112" y1="88" x2="140" y2="75" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="88" y1="102" x2="60" y2="115" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="112" y1="102" x2="140" y2="115" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Outer nodes -->
  <circle cx="100" cy="44" r="5" fill="#6366f1"/>
  <circle cx="100" cy="146" r="5" fill="#6366f1"/>
  <circle cx="55" cy="70" r="5" fill="#6366f1"/>
  <circle cx="145" cy="70" r="5" fill="#6366f1"/>
  <circle cx="55" cy="120" r="5" fill="#6366f1"/>
  <circle cx="145" cy="120" r="5" fill="#6366f1"/>
  <!-- Text -->
  <text x="100" y="176" font-family="Inter, sans-serif" font-size="10" font-weight="700"
